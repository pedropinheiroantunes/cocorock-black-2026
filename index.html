<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Black Friday Coco Rock 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&family=Ubuntu+Mono:wght@400;700&display=swap">
<style>
:root{--bg:#F6F8F0;--surface:#FFFFFF;--fg:#22261A;--muted:#62684F;--line:#DDE3CC;--green:#91A93E;--green-ink:#4D5E17;--coco:#8A6447;--bad:#B03A2E;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161A10;--surface:#1F2417;--fg:#E9EDDC;--muted:#A5AC90;--line:#343C27;--green:#A6BE52;--green-ink:#C3D77A;--coco:#D2A57F;--bad:#E57A6E;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font-family:"Ubuntu",system-ui,sans-serif;padding:16px}
.card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:32px 28px}
.eye{font-family:"Ubuntu Mono",monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--coco)}
h1{font-size:26px;line-height:1.15;margin:8px 0 6px}
h1 em{font-style:normal;color:var(--green-ink)}
p{color:var(--muted);font-size:15px;margin:0 0 20px}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
input{width:100%;font:inherit;font-size:16px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg)}
input:focus{outline:2px solid var(--green);outline-offset:1px}
button{margin-top:12px;width:100%;font:inherit;font-weight:700;font-size:16px;padding:12px;border:0;border-radius:10px;background:var(--green);color:#1B2208;cursor:pointer}
button:disabled{opacity:.6;cursor:progress}
.err{min-height:20px;margin-top:10px;font-size:14px;color:var(--bad)}
.foot{margin-top:18px;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<form class="card" id="f" autocomplete="off">
  <div class="eye">Coco Rock · reunião de sócios</div>
  <h1>Black Friday <em>2026</em></h1>
  <p>Conteúdo restrito. Digite a senha enviada pelo time.</p>
  <label for="pw">Senha</label>
  <input id="pw" type="password" autofocus required>
  <button id="go" type="submit">Abrir apresentação</button>
  <div class="err" id="err" role="alert"></div>
  <div class="foot">Conteúdo cifrado (AES-256). Sem a senha, nada é legível.</div>
</form>

const u=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
const norm=p=>p.trim().toLowerCase().replace(/\s+/g," ");
async function open_(pw){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(norm(pw)),"PBKDF2",false,["deriveKey"]);
  const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(D.s),iterations:D.n,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u(D.i)},k,u(D.c));
  return new TextDecoder().decode(pt);
}
function show(html){document.open();document.write(html);document.close();}
const f=document.getElementById("f"),go=document.getElementById("go"),err=document.getElementById("err");
f.addEventListener("submit",async e=>{
  e.preventDefault();go.disabled=true;err.textContent="";
  const pw=document.getElementById("pw").value;
  try{const h=await open_(pw);try{sessionStorage.setItem("bf26",pw)}catch(_){}show(h);}
  catch(_){err.textContent="Senha incorreta. Tente de novo.";go.disabled=false;}
});
(async()=>{let s=null;try{s=sessionStorage.getItem("bf26")}catch(_){}if(s){try{show(await open_(s))}catch(_){}}})();
